<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="16" fill="#0e1520"/>

  <!-- Outer hexagon -->
  <polygon
    points="40,8 68,24 68,56 40,72 12,56 12,24"
    fill="none"
    stroke="#3ecfbd"
    stroke-width="2.5"
  />
  <!-- Inner hex ring -->
  <polygon
    points="40,18 61,30 61,50 40,62 19,50 19,30"
    fill="none"
    stroke="#3ecfbd"
    stroke-width="1"
    opacity="0.25"
  />

  <!-- Corner nodes -->
  <circle cx="40" cy="8"  r="3" fill="#3ecfbd"/>
  <circle cx="68" cy="24" r="3" fill="#3ecfbd"/>
  <circle cx="68" cy="56" r="3" fill="#3ecfbd"/>
  <circle cx="40" cy="72" r="3" fill="#3ecfbd"/>
  <circle cx="12" cy="56" r="3" fill="#3ecfbd"/>
  <circle cx="12" cy="24" r="3" fill="#3ecfbd"/>

  <!-- HL letterform -->
  <line x1="27" y1="29" x2="27" y2="51" stroke="#3ecfbd" stroke-width="3" stroke-linecap="round"/>
  <line x1="27" y1="40" x2="39" y2="40" stroke="#3ecfbd" stroke-width="3" stroke-linecap="round"/>
  <line x1="39" y1="29" x2="39" y2="51" stroke="#3ecfbd" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="29" x2="44" y2="51" stroke="#3ecfbd" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="44" y1="51" x2="53" y2="51" stroke="#3ecfbd" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
