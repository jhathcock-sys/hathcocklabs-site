<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
    </style>
    <!-- Cyan glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ecfbd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ab8a6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon icon mark -->
  <!-- Flat-top hexagon, centered at 40,40, radius 32 -->
  <polygon
    points="40,8 69,24 69,56 40,72 11,56 11,24"
    fill="none"
    stroke="#3ecfbd"
    stroke-width="2"
    opacity="0.9"
    filter="url(#glow)"
  />
  <!-- Inner hexagon (smaller) -->
  <polygon
    points="40,18 62,30 62,50 40,62 18,50 18,30"
    fill="none"
    stroke="#3ecfbd"
    stroke-width="1"
    opacity="0.3"
  />

  <!-- Circuit nodes on outer hex corners -->
  <circle cx="40" cy="8"  r="2.5" fill="#3ecfbd" opacity="0.8"/>
  <circle cx="69" cy="24" r="2.5" fill="#3ecfbd" opacity="0.8"/>
  <circle cx="69" cy="56" r="2.5" fill="#3ecfbd" opacity="0.8"/>
  <circle cx="40" cy="72" r="2.5" fill="#3ecfbd" opacity="0.8"/>
  <circle cx="11" cy="56" r="2.5" fill="#3ecfbd" opacity="0.8"/>
  <circle cx="11" cy="24" r="2.5" fill="#3ecfbd" opacity="0.8"/>

  <!-- HL letterform inside hex -->
  <!-- H left vertical -->
  <line x1="29" y1="30" x2="29" y2="50" stroke="#3ecfbd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- H crossbar -->
  <line x1="29" y1="40" x2="40" y2="40" stroke="#3ecfbd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- H right vertical -->
  <line x1="40" y1="30" x2="40" y2="50" stroke="#3ecfbd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- L vertical -->
  <line x1="45" y1="30" x2="45" y2="50" stroke="#3ecfbd" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- L base -->
  <line x1="45" y1="50" x2="54" y2="50" stroke="#3ecfbd" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Wordmark -->
  <!-- HATHCOCK in white bold -->
  <text
    x="92" y="36"
    font-family="Space Grotesk, system-ui, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#f4f4f6"
    letter-spacing="-0.5"
  >HATHCOCK</text>

  <!-- LABS in cyan -->
  <text
    x="92" y="58"
    font-family="Space Grotesk, system-ui, sans-serif"
    font-size="16"
    font-weight="400"
    fill="#3ecfbd"
    letter-spacing="4"
  >LABS</text>

  <!-- Subtle tagline dot separator -->
  <circle cx="84" cy="47" r="1.5" fill="#3ecfbd" opacity="0.4"/>
</svg>
